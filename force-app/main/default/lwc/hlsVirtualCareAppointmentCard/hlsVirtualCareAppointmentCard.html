<template>
    <div class="patientname slds-m-bottom_xx-small" onclick={navigateToRecordPage}>{appointment.meetingWithName}</div>
    <div class="slds-m-top_xxx-small appointmentTitle">
        <div class="relativePosition subject">
            {appointment.subject}
            <div class="helpIcon">
                <lightning-helptext content={appointment.description}></lightning-helptext>
            </div>
        </div>
    </div>
    <div class="relativePosition slds-m-top_x-small" if:true={showGuestWaiting}>
        <div class="groupIcon">
            <lightning-icon icon-name="utility:groups" alternative-text="people" title="" size="xx-small">
            </lightning-icon>
        </div>
        <div class="slds-m-top_xx-small slds-p-left_large slds-m-left_x-small guestWaitingText">1 guest waiting to join</div>
    </div>
    <div class="relativePosition slds-m-top_x-small">
        <div class="clockIcon">
            <lightning-icon icon-name="utility:clock" alternative-text="clock" title="" size="x-small">
            </lightning-icon>
        </div>
        <div class="slds-m-top_xx-small slds-m-left_large slds-p-left_x-small">{appointment.formattedStartTime} {timeZoneString}</div>
    </div>
    <lightning-layout horizontal-align="spread">
        <lightning-layout-item>
            <div class="relativePosition slds-m-top_x-small">
                <div class="clockIcon">
                    <lightning-icon icon-name="utility:video" alternative-text="video" title="" size="x-small">
                    </lightning-icon>
                </div>
                <div class="slds-m-top_xx-small slds-m-left_large slds-p-left_x-small">Video Call</div>
            </div>
        </lightning-layout-item>
        <lightning-layout-item padding="horizontal-small">
            <lightning-button
                variant="brand"
                label="Start Video Call"
                title="Start Video Call"
                onclick={startCall}
                if:false={appointment.appointmentEnded}>
            </lightning-button>
        </lightning-layout-item>
    </lightning-layout>
    <div class="border slds-m-top_small"></div>
</template>
