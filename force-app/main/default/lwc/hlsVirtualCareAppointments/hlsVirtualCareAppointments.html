<template>
    <lightning-tabset>
        <lightning-tab label="Upcoming">
            <div class="slds-m-left_medium">
                <div if:true={showNoUpcomingAppointmentsMessage}>No upcoming appointments</div>
                <template for:each={upcomingAppointmentsByDay} for:item="appointmentList">
                    <c-hls-virtual-care-appointment-day-divider
                        key={appointmentList.formattedDate}
                        first-day={appointmentList.firstDay}
                        appointments-today={appointmentList.appointmentsToday}
                        date-text={appointmentList.formattedDate}
                        number-of-appointments={appointmentList.numberOfAppointments}
                        trigger-refresh-appointments={triggerRefreshAppointments}>
                    </c-hls-virtual-care-appointment-day-divider>
                    <template for:each={appointmentList.appointments} for:item="appointment">
                        <div class="slds-m-top_medium" key={appointment.appointmentId}>
                            <c-hls-virtual-care-appointment-card appointment={appointment}></c-hls-virtual-care-appointment-card>
                        </div>
                    </template>
                </template>
            </div>
        </lightning-tab>
        <lightning-tab label="Past">
            <div class="slds-m-left_medium">
                <div if:true={showNoPastAppointmentsMessage}>No past appointments</div>
                <template for:each={pastAppointmentsByDay} for:item="appointmentList">
                    <c-hls-virtual-care-appointment-day-divider
                        key={appointmentList.formattedDate}
                        first-day={appointmentList.firstDay}
                        appointments-today={appointmentList.appointmentsToday}
                        date-text={appointmentList.formattedDate}
                        number-of-appointments={appointmentList.numberOfAppointments}>
                    </c-hls-virtual-care-appointment-day-divider>
                    <template for:each={appointmentList.appointments} for:item="appointment">
                        <div class="slds-m-top_medium" key={appointment.appointmentId}>
                            <c-hls-virtual-care-appointment-card appointment={appointment}></c-hls-virtual-care-appointment-card>
                        </div>
                    </template>
                </template>
            </div>
        </lightning-tab>
    </lightning-tabset>
</template>
