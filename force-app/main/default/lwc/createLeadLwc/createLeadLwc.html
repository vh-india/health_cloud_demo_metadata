<template>
  <div class="container">
    <!-- Left Section -->
    <div class="left">
      <img src={hospitalImage} alt="Trinity Hope Hospital" />
      <div class="left-text">
        <h2>Why Choose Trinity Hope Hospital?</h2>
        <p>Compassionate care with advanced medical technology.</p>
        <p>Expert doctors and dedicated nursing staff.</p>
        <p>Comprehensive treatment in a safe and friendly environment.</p>
      </div>
    </div>

    <!-- Right Section -->
    <div class="right">
      <div class="form-wrapper">
        <h2>Patient Registration – Trinity Hope Hospital</h2>

        <!-- First Name -->
        <label for="first_name">First Name *</label>
        <input id="first_name" type="text" placeholder="Enter patient's first name" />

        <!-- Last Name -->
        <label for="last_name">Last Name *</label>
        <input id="last_name" type="text" placeholder="Enter patient's last name" />

        <!-- Email -->
        <label for="email">Email *</label>
        <input id="email" type="email" placeholder="Enter patient's email address" />

        <!-- Phone -->
        <label for="phone">Phone *</label>
        <input id="phone" type="text" placeholder="Enter patient's phone number" />

        <!-- DOB -->
        <label for="dob">Date of Birth</label>
        <input id="dob" type="date" />

        <!-- Gender -->
        <label for="gender">Gender</label>
        <select id="gender">
          <option value="">--None--</option>
          <option value="Female">Female</option>
          <option value="Male">Male</option>
          <option value="Other">Other</option>
        </select>

        <!-- City -->
        <label for="city">City</label>
        <input id="city" maxlength="40" type="text" placeholder="Enter city" />

        <!-- State -->
        <label for="state">State/Province</label>
        <input id="state" maxlength="20" type="text" placeholder="Enter state or province" />

        <!-- Country -->
        <label for="country">Country</label>
        <input id="country" maxlength="40" type="text" placeholder="Enter country" />

        <!-- Reason for Visit -->
        <label for="description">Reason for Visit / Medical Concern</label>
        <textarea id="description" maxlength="500"
          placeholder="Briefly describe the patient's medical concern"></textarea>

        <!-- Submit -->
        <button type="button" onclick={handleSubmit}>Submit</button>
      </div>
    </div>
  </div>
</template>
