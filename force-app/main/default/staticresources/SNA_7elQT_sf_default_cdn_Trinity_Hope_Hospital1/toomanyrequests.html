  body, html {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: "Nunito Sans", sans-serif;
    background-color: #F3F8FF;
    overflow-x: hidden;
  }

  .container {
    display: flex;
    flex-direction: column;
    max-width: 1200px;
    margin: 2rem auto;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 12px rgba(0,0,0,0.1);
    background: #F3F8FF;
  }

  .left, .right {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .left {
    background: transparent;
    color: #28292A;
  }

  .left img {
    width: 100%;
    height: 50vh;
    object-fit: cover;
    border-radius: 20px;
    padding-top: 30px;
  }

  .left-text {
    padding: 2rem;
    height: auto;
  }

  .left-text h2 {
    font-size: 2rem;
    margin-bottom: 1rem;
  }

  .left-text p {
    font-size: 1.15rem;
    line-height: 1.5;
    margin-bottom: 0.75rem;
  }

  .right {
    background: #F3F8FF;
    padding: 2rem;
  }

  .form-wrapper {
    background: white;
    padding: 2rem 3rem;
    border-radius: 12px;
  }

  form {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  form h2 {
    text-align: center;
    margin-bottom: 2rem;
    font-weight: 700;
    color: #293377;
  }

  label {
    font-weight: 600;
    margin-bottom: 0.3rem;
    font-size: 1.1rem;
    color: #28292A;
  }

  input[type=text],
  input[type=email],
      input[type=date],
  textarea,
  select {
    font-family: "Nunito Sans";
    font-size: 1.2rem;
    padding: 10px 14px;
    border-radius: 12px;
    border: none;
    background-color: #F3F8FF;
    color: #28292A;
    margin-bottom: 1.5rem;
    outline: none;
    box-sizing: border-box;
    width: 100%;
  }

  textarea {
    resize: vertical;
    min-height: 80px;
  }

  input[type=submit] {
    font-family: "Nunito Sans";
    font-weight: bold;
    font-size: 1.3rem;
    padding: 12px 24px;
    border-radius: 12px;
    border: 2px solid transparent;
    background-color: #293377;
    color: #F3F8FF;
    cursor: pointer;
    transition: background-color 0.3s ease;
    max-width: 260px;
    align-self: center;
  }

  input[type=submit]:hover {
    background-color: #1f275a;
  }

  input::placeholder,
  textarea::placeholder {
    color: rgba(40, 41, 42, 0.3);
    font-style: normal;
  }

  select {
    -webkit-appearance: none;
    -moz-appearance: none;
    padding-right: 20px;
    text-indent: 1px;
    line-height: 1.5;
  }

  @media (min-width: 768px) {
    .container {
      flex-direction: row;
    }

    .left img {
      height: 100%;
      border-bottom-left-radius: 0;
    }
  }
     .address-row {
  display: flex;
  gap: 1rem; /* space between columns */
  margin-bottom: 1.5rem;
}

.address-col {
  flex: 1; /* make columns equal width */
  display: flex;
  flex-direction: column;
}

</style>
