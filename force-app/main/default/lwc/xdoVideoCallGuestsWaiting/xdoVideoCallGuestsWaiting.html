<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open slds-modal_large">
        <div  class="slds-modal__container">
            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeModal}>
                <c-xdo-icon
                    icon-type="utility"
                    icon-name="close"
                    icon-class="slds-button__icon slds-button__icon_large"
                    assistive-text="Close">
                </c-xdo-icon>
                <span class="slds-assistive-text">Cancel and close</span>
            </button>
            <div class="slds-modal__header">
                <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Participants</h1>
            </div>
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                <div class="slds-m-bottom_small slds-text-heading_small" if:true={guestsWaiting}>1 guest waiting to join the call</div>
                <article class="slds-card slds-card_boundary" if:true={guestsWaiting}>
                    <div class="slds-card__body slds-card__body_inner slds-clearfix">
                        <div class="slds-text-title_bold slds-m-top_xx-small block">{appointment.meetingWithName}</div>
                        <div class="slds-float_right block">
                            <button class="slds-button slds-button_neutral slds-m-right_x-small slds-button_text-destructive" onclick={declineRequestToJoin}>
                                <c-xdo-icon
                                    icon-type="utility"
                                    icon-name="close"
                                    icon-class="slds-button__icon slds-button__icon_left"
                                    assistive-text="Decline">
                                </c-xdo-icon>
                                Decline
                            </button>
                            <button class="slds-button slds-button_neutral" onclick={admitGuest}>
                                <c-xdo-icon
                                    icon-type="utility"
                                    icon-name="check"
                                    icon-class="slds-button__icon slds-button__icon_left"
                                    assistive-text="Admit">
                                </c-xdo-icon>
                                Admit
                            </button>
                        </div>
                        <div class="slds-m-top_medium">
                            <table class="slds-table slds-table_cell-buffer slds-no-row-hover slds-table_bordered" aria-label="Example table of Opportunities with no row hovers">
                                <thead>
                                <tr class="slds-line-height_reset">
                                    <th class="" scope="col">
                                    <div class="slds-truncate" title="Fields">Fields</div>
                                    </th>
                                    <th class="" scope="col">
                                    <div class="slds-truncate" title="As entered by the guest">As entered by the guest</div>
                                    </th>
                                    <th class="" scope="col">
                                    <div class="slds-truncate" title="In the contact record">In the contact record</div>
                                    </th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="slds-hint-parent">
                                    <th data-label="Fields" scope="row">
                                        <div class="slds-truncate" title="First Name">First Name</div>
                                    </th>
                                    <td data-label="As entered by the guest">
                                    <div class="slds-truncate" title={appointment.meetingWithFirstName}>{appointment.meetingWithFirstName}</div>
                                    </td>
                                    <td data-label="In the contact record">
                                    <div class="slds-truncate" title={appointment.meetingWithFirstName}>{appointment.meetingWithFirstName}</div>
                                    </td>
                                </tr>
                                <tr class="slds-hint-parent">
                                    <th data-label="Fields" scope="row">
                                        <div class="slds-truncate" title="First Name">Last Name</div>
                                    </th>
                                    <td data-label="As entered by the guest">
                                    <div class="slds-truncate" title={appointment.meetingWithLastName}>{appointment.meetingWithLastName}</div>
                                    </td>
                                    <td data-label="In the contact record">
                                    <div class="slds-truncate" title={appointment.meetingWithLastName}>{appointment.meetingWithLastName}</div>
                                    </td>
                                </tr>
                                <tr class="slds-hint-parent">
                                    <th data-label="Fields" scope="row">
                                        <div class="slds-truncate" title="Date of Birth">Date of Birth</div>
                                    </th>
                                    <td data-label="As entered by the guest">
                                        <div class="slds-truncate" title={appointment.meetingWithLastName}>
                                            <lightning-formatted-date-time value={appointment.meetingWithDOB}></lightning-formatted-date-time>
                                        </div>
                                    </td>
                                    <td data-label="In the contact record">
                                        <div class="slds-truncate" title={appointment.meetingWithLastName}>
                                            <lightning-formatted-date-time value={appointment.meetingWithDOB}></lightning-formatted-date-time>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </article>
                <div if:false={guestsWaiting}>
                    <c-xdo-camper-illustration
                        title="No guests waiting to join"
                        sub-title="As and when guests enter your waiting room, their information will appear here.">
                    </c-xdo-camper-illustration>
                </div>
            </div>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
