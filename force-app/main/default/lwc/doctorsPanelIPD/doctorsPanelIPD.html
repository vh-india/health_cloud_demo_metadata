<template>
    <template for:each={wardData} for:item="ward">
        <lightning-card key={ward.wardName} title={ward.wardName} class="slds-m-around_medium">
            <div class="slds-p-around_large">
                <lightning-tabset variant="vertical">
                    <template for:each={ward.patients} for:item="patient">
                        <lightning-tab key={patient.patientId} label={patient.bedName}>
                            <div class="slds-p-around_small slds-grid slds-wrap slds-grid_align-spread">
                                <div>
                                    <p><strong>Patient Name:</strong> {patient.patientName}</p>
                                    <p><strong>Patient Id:</strong> {patient.patientId}</p>
                                </div>
                                <div>
                                    <lightning-button 
                                        variant="brand" 
                                        label="View Details" 
                                        title="View Details"
                                        onclick={handleViewDetails}
                                        data-id={patient.patientId}>
                                    </lightning-button>
                                </div>
                            </div>
                        </lightning-tab>

                    </template>
                </lightning-tabset>
            </div>
        </lightning-card>
    </template>
</template>
