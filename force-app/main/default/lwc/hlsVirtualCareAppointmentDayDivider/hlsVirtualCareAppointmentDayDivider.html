<template>
    <div if:false={firstDay} class="slds-m-top_small">&nbsp;</div>
    <div class="slds-grid">
        <div class="slds-col slds-size_11-of-12">
            <div class="slds-text-body_regular dateTitle relativePosition">
                {fullDateText}
                <div class="calendarIcon">
                    <lightning-icon icon-name="utility:event" alternative-text="refresh" title="" size="x-small"></lightning-icon>
                </div>
            </div>
        </div>
        <div class="slds-col slds-size_1-of-12">
            <lightning-button-icon
                icon-name="utility:refresh" 
                alternative-text="Refresh appointments"
                title=""
                size="x-small"
                variant="brand"
                if:true={firstDay}
                onclick={refreshAppointments}>
            </lightning-button-icon>
        </div>
    </div>
    <div class="slds-m-top_xx-small">{numberOfAppointmentsText}</div>
</template>
