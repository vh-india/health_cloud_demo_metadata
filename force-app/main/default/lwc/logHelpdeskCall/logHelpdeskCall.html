<template>
    <div class="container">
        <div class="left">
            <img src={hospitalImage} alt="Trinity Hope Hospital" />
            <div class="left-text">
                <h2>Why Choose Trinity Hope Hospital?</h2>
                <p>Compassionate care with advanced medical technology.</p>
                <p>Expert doctors and dedicated nursing staff.</p>
                <p>Comprehensive treatment in a safe and friendly environment.</p>
            </div>
        </div>

        <div class="right">
            <div class="form-wrapper">
                <form action={webToCaseUrl} method="POST" accept-charset="UTF-8">
                    <h2>Submit a Case – Trinity Hope Hospital</h2>

                    <!-- Hidden -->
                    <input type="hidden" name="orgid" value={orgId} />
                    <input type="hidden" name="retURL" value={retUrl} />
                    <input type="hidden" name="external" value="1" />

                    <label for="name">Contact Name *</label>
                    <input id="name" maxlength="80" name="name" type="text" required placeholder="Enter your full name" />

                    <label for="email">Email *</label>
                    <input id="email" maxlength="80" name="email" type="email" required placeholder="Enter your email address" />

                    <label for="phone">Phone *</label>
                    <input id="phone" maxlength="40" name="phone" type="text" required placeholder="Enter your phone number" />

                    <label for="subject">Subject *</label>
                    <input id="subject" maxlength="80" name="subject" type="text" required placeholder="Brief subject of your case" />

                    <label for="description">Description *</label>
                    <textarea id="description" name="description" maxlength="1000" required placeholder="Describe your issue in detail"></textarea>

                    <label for="priority">Priority</label>
                    <select id="priority" name="priority">
                        <option value="">--Select Priority--</option>
                        <option value="Critical">Critical</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                        <option value="Urgent">Urgent</option>
                        <option value="Routine">Routine</option>
                        <option value="Deferred">Deferred</option>
                        <option value="Normal">Normal</option>
                        <option value="Stat">Stat</option>
                    </select>

                    <label for="case_type">Case Type</label>
                    <select id="case_type" name="00NKa00000JreJZ" title="Case Type">
                        <option value="">--Select Case Type--</option>
                        <option value="Inquiry">Inquiry</option>
                        <option value="Compliant">Compliant</option>
                        <option value="Feedback">Feedback</option>
                    </select>

                    <input type="submit" value="Submit Case" />
                </form>
            </div>
        </div>
    </div>
</template>
