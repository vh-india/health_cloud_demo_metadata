<template>
    <lightning-layout lwc:if={isEncounterSelected} multiple-rows>
        <lightning-layout-item size="12">
            <div class="slds-text-heading_medium slds-p-bottom_medium">Patient Medical History</div>
        </lightning-layout-item>
        <lightning-layout-item size="12">
            <lightning-card  title={patientName}>
                <p class="slds-p-horizontal_large">Age: 25</p>
                <p class="slds-p-horizontal_large">Gender: M</p>
            </lightning-card>
        </lightning-layout-item>
        <lightning-layout-item size="12">
            <lightning-accordion allow-multiple-sections-open>
                <template for:each={encounters} for:item="enc">
                    <lightning-accordion-section 
                        key={enc.Id}
                        name={enc.Id}
                        label={enc.Name}>

                        <div class="slds-text-body_regular slds-m-bottom_small">
                            <!-- <p><b>Doctor:</b> {enc.Doctor__r.Name}</p> -->
                            <p><b>Summary:</b> {enc.Summary__c}</p>
                            <p><b>Status:</b> {enc.Status}</p>
                            <p><b>Category:</b> {enc.Category}</p>
                        </div>

                        <template if:true={enc.Prescription__r}>
                            <p class="slds-text-title_bold">Prescriptions:</p>
                            <ul class="slds-list_dotted slds-m-left_medium">
                                <template for:each={enc.Prescription__r} for:item="presc">
                                    <li key={presc.Id}>
                                        {presc.Medication_Name__c} - {presc.Dosage__c}, {presc.Frequency__c} for {presc.Duration__c} days
                                    </li>
                                </template>
                            </ul>
                        </template>
                    </lightning-accordion-section>
                </template>
            </lightning-accordion>
        </lightning-layout-item>
    </lightning-layout>
    <lightning-layout lwc:else multiple-rows>
        <lightning-card>
            <img src={noEncounterImgUrl}></img>
        </lightning-card>
    </lightning-layout>
</template>
