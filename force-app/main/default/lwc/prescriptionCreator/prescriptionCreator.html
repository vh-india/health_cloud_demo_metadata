<template>
    <template lwc:if={isEncounterSelected}>
        <lightning-card title="Add Prescription">
            <div class="slds-p-around_medium">
                <lightning-record-edit-form object-api-name="Prescription__c" onsuccess={handleSuccess} onerror={handleError}>
                    <lightning-layout multiple-rows>
                        <lightning-layout-item size="12">
                            <lightning-input-field field-name="Clinical_Encounter__c" value={RxClinicalEncounter} disabled></lightning-input-field>
                        </lightning-layout-item>
                        <lightning-layout-item size="12">
                            <lightning-input-field field-name="Date_Issued__c" value={RxIssuedDate} disabled></lightning-input-field>
                        </lightning-layout-item>
                        <lightning-layout-item size="12">
                            <lightning-input-field field-name="Medication_Name__c"></lightning-input-field>
                        </lightning-layout-item>
                        <lightning-layout-item size="4">
                            <lightning-input-field field-name="Frequency__c"></lightning-input-field>
                        </lightning-layout-item>
                        <lightning-layout-item size="4">
                            <lightning-input-field field-name="Dosage__c"></lightning-input-field>
                        </lightning-layout-item>
                        <lightning-layout-item size="4">
                            <lightning-input-field field-name="Duration__c"></lightning-input-field>
                        </lightning-layout-item>
                        <lightning-layout-item size="12">
                            <lightning-input-field field-name="Prescribed_By__c" value={RxPrecriptionBy} disabled></lightning-input-field>
                        </lightning-layout-item>
                        <lightning-layout-item size="12">
                            <div class="slds-border_top slds-p-top_medium slds-text-align_right">
                                <lightning-button type="submit" label="Create Prescription" variant="brand"></lightning-button>
                            </div>
                        </lightning-layout-item>
                    </lightning-layout>
                </lightning-record-edit-form>
            </div>
        </lightning-card>
    </template>
    <template lwc:else>
        <lightning-card>
            <img src={noEncounterImgUrl}></img>
        </lightning-card>
    </template>
    
</template>
